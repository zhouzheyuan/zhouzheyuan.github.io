<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">3A-VLA paper cover</title>
  <desc id="desc">Abstract game-world grid with aligned vision, language, and action paths.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#111e3a"/>
      <stop offset="1" stop-color="#264d76"/>
    </linearGradient>
    <linearGradient id="path" x2="1" y2="0">
      <stop stop-color="#65d4da"/>
      <stop offset="1" stop-color="#fac981"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#a6c4da" stroke-opacity=".13"/>
    </pattern>
  </defs>
  <rect width="600" height="400" rx="18" fill="url(#bg)"/>
  <rect width="600" height="400" rx="18" fill="url(#grid)"/>
  <path d="M88 259 179 207 274 252 368 178 492 214" fill="none" stroke="url(#path)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff" stroke="#65d4da" stroke-width="5">
    <circle cx="88" cy="259" r="13"/><circle cx="179" cy="207" r="13"/><circle cx="274" cy="252" r="13"/>
  </g>
  <g fill="#fff" stroke="#fac981" stroke-width="5">
    <circle cx="368" cy="178" r="13"/><circle cx="492" cy="214" r="13"/>
  </g>
  <text x="55" y="107" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700">3A-VLA</text>
  <text x="57" y="145" fill="#d8eaf2" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="2">VISION · LANGUAGE · ACTION</text>
  <text x="57" y="348" fill="#d8eaf2" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="2">3D GAME WORLDS</text>
</svg>
